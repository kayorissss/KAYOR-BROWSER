name: Build KAYOR Browser

on:
  push:
    branches: [arena/01a0ba41-kayor-browser, main]
    tags: [v*]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build Windows (NSIS + Portable)
        id: build_win
        continue-on-error: true
        run: |
          npx electron-builder --win --x64 --publish=never 2>&1 | tee builder-win.log
          EXIT=${PIPESTATUS[0]}
          echo "builder exit $EXIT"
          echo "exit=$EXIT" >> $GITHUB_OUTPUT
          cat builder-win.log
          exit $EXIT
        env:
          DEBUG: electron-builder
      - name: List release
        if: always()
        run: |
          echo "=== release ==="; ls -R release 2>&1 || echo "no release"
          echo "=== dist ==="; ls -R dist 2>&1 | head -n 50
          echo "=== builder log ==="; cat builder-win.log 2>&1 | tail -n 300 || echo "no log"
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KAYOR-Windows
          path: |
            release/
            dist/
            builder-win.log
          if-no-files-found: warn
          retention-days: 14

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build Linux
        run: |
          npx electron-builder --linux --x64 --publish=never 2>&1 | tee builder-linux.log
          EXIT=${PIPESTATUS[0]}
          echo "builder exit $EXIT"
          cat builder-linux.log
          exit $EXIT
        env:
          DEBUG: electron-builder
      - name: List release
        if: always()
        run: |
          echo "=== release ==="; ls -R release 2>&1 || echo "no release"
          echo "=== builder log ==="; cat builder-linux.log 2>&1 | tail -n 200 || echo "no log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KAYOR-Linux
          path: |
            release/
            builder-linux.log
          if-no-files-found: warn
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') && always()
    needs: [build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KAYOR-Windows
          path: ./artifacts
      - run: ls -R artifacts 2>&1 || echo "no artifacts"
      - uses: softprops/action-gh-release@v2
        if: hashFiles('artifacts/**/*') != ''
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
